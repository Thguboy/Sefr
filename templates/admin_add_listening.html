{% extends 'base.html' %}
{% block title %}Yangi Listening test — Admin{% endblock %}
{% block content %}
<div class="page-header admin-header"><div class="container"><h1><i class="bi bi-plus-circle me-2"></i>Yangi Listening Test</h1></div></div>
<div class="container py-4" style="max-width:820px">
  <div class="card">
    <div class="card-body">
      <form method="POST" enctype="multipart/form-data">
        <div class="row g-3 mb-3">
          <div class="col-md-7">
            <label class="form-label fw-semibold">Test nomi</label>
            <input type="text" name="title" class="form-control" required placeholder="Masalan: At the Café (A1)">
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold">Daraja</label>
            <select name="level" class="form-select" required>
              {% for lvl in levels %}<option>{{ lvl }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-1">
            <label class="form-label fw-semibold">Vaqt</label>
            <input type="number" name="time_limit" class="form-control" value="15" min="5">
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold">Maks. o'ynat</label>
            <input type="number" name="max_plays" class="form-control" value="2" min="1" max="5">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Audio fayl (MP3)</label>
          <input type="file" name="audio_file" class="form-control" accept="audio/*">
          <small class="text-muted">static/audio/ papkasiga saqlanadi</small>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Transkript (ixtiyoriy)</label>
          <textarea name="transcript" class="form-control" rows="5" placeholder="Audio matni..."></textarea>
        </div>

        <h6 class="fw-bold text-primary mb-3">Savollar</h6>
        <div id="questions-container"></div>
        <button type="button" class="btn btn-outline-primary btn-sm mb-4" onclick="addQuestion()">
          <i class="bi bi-plus me-1"></i>Savol qo'shish
        </button>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-warning text-white"><i class="bi bi-save me-1"></i>Saqlash</button>
          <a href="{{ url_for('admin_panel') }}" class="btn btn-outline-secondary">Bekor qilish</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
let qIdx = 0;
function addQuestion(){
  const c = document.getElementById('questions-container');
  const div = document.createElement('div');
  div.className = 'card mb-3 p-3';
  div.innerHTML = `
    <div class="row g-2 align-items-end">
      <div class="col-md-2">
        <label class="form-label small fw-semibold">Tur</label>
        <select name="q_type[]" class="form-select form-select-sm">
          <option value="mcq">MCQ</option><option value="tf">True/False</option><option value="gap">Gap-fill</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Savol</label>
        <input type="text" name="q_text[]" class="form-control form-control-sm" required placeholder="Savol matni...">
      </div>
      <div class="col-md-4">
        <label class="form-label small fw-semibold">Variantlar (| bilan)</label>
        <input type="text" name="q_options[]" class="form-control form-control-sm" placeholder="A | B | C | D">
      </div>
      <div class="col-md-10">
        <label class="form-label small fw-semibold">To'g'ri javob</label>
        <input type="text" name="q_answer[]" class="form-control form-control-sm" required>
      </div>
      <div class="col-md-2 text-end">
        <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.card').remove()"><i class="bi bi-trash"></i></button>
      </div>
    </div>`;
  c.appendChild(div); qIdx++;
}
addQuestion();
</script>
{% endblock %}
